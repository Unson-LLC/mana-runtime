name: Apply and verify Mana improvement UX

on:
  push:
    branches:
      - codex/mana-improvement-ux-p0-p1
    paths:
      - scripts/apply-mana-improvement-ux.mjs
      - .github/workflows/mana-improvement-ux-apply.yml

permissions:
  contents: write

concurrency:
  group: mana-improvement-ux-apply
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mana-improvement-ux-p0-p1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Apply composition-root patches
        run: node scripts/apply-mana-improvement-ux.mjs

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate diff
        run: git diff --check

      - name: Commit verified implementation and remove temporary applicator
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            packages/cloud-runtime/src/index.ts \
            packages/cloud-runtime/src/reply-pipeline.ts \
            packages/cloud-runtime/src/slack-interactions.ts \
            packages/cloud-runtime/src/development-callback.ts \
            packages/cloud-runtime/src/multitenancy/development-callback-proxy.ts \
            packages/cloud-runtime/src/__tests__/development-callback.test.ts
          git rm -- scripts/apply-mana-improvement-ux.mjs .github/workflows/mana-improvement-ux-apply.yml
          git diff --cached --check
          git commit -m "feat(mana): add guided self-improvement UX"
          git push origin HEAD:codex/mana-improvement-ux-p0-p1
