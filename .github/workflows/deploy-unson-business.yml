name: Cloudflare本番配備（unson-business）

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 配備理由（監査用）
        required: true
        type: string
      skip_container_rollout:
        description: Workerのみを配備し、既知正常なContainerを維持する
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-production-unson-business
  cancel-in-progress: false

jobs:
  deploy:
    name: 認可済みコミットを配備
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://unson-business-mana-runtime.unson.workers.dev
    steps:
      - name: 正本を取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: pnpmを準備
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 依存関係を取得
        run: pnpm install --no-frozen-lockfile --lockfile=false

      - name: CI用秘密情報の存在を確認
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAINBASE_TASK_API_TOKEN: ${{ secrets.BRAINBASE_TASK_API_TOKEN }}
          BRAINBASE_GRAPH_API_TOKEN: ${{ secrets.BRAINBASE_GRAPH_API_TOKEN }}
          SANDBOX_PROBE_TOKEN: ${{ secrets.SANDBOX_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BRAINBASE_TASK_API_TOKEN"
          test -n "$BRAINBASE_GRAPH_API_TOKEN"
          test -n "$SANDBOX_PROBE_TOKEN"

      - name: 既存の安全ゲートを通して配備
        run: pnpm deploy:unson-business
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAINBASE_TASK_API_BASE_URL: https://bb.unson.jp
          BRAINBASE_GRAPH_API_BASE_URL: https://bb.unson.jp
          BRAINBASE_TASK_API_TOKEN: ${{ secrets.BRAINBASE_TASK_API_TOKEN }}
          BRAINBASE_GRAPH_API_TOKEN: ${{ secrets.BRAINBASE_GRAPH_API_TOKEN }}
          UNSON_BUSINESS_WORKER_URL: https://unson-business-mana-runtime.unson.workers.dev
          SANDBOX_PROBE_TOKEN: ${{ secrets.SANDBOX_PROBE_TOKEN }}
          MANA_DEPLOY_CANDIDATE_COMMIT: ${{ github.sha }}
          MANA_SKIP_CONTAINER_ROLLOUT: ${{ inputs.skip_container_rollout }}

      - name: 配備証跡を記録
        shell: bash
        env:
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## Cloudflare本番配備"
            echo "- 対象: unson-business-mana-runtime"
            echo "- コミット: \`${GITHUB_SHA}\`"
            echo "- 実行者: \`${GITHUB_ACTOR}\`"
            echo "- 理由: ${DEPLOY_REASON}"
            echo "- 結果: 配備スクリプト内の事前確認、Wrangler配備、配備後ヘルスチェックが完了"
          } >> "$GITHUB_STEP_SUMMARY"
