name: Complete and verify Mana same-Story continuation

on:
  push:
    branches:
      - codex/mana-improvement-ux-p0-p1
    paths:
      - scripts/complete-mana-improvement-continuation.mjs
      - .github/workflows/mana-improvement-continuation.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mana-improvement-ux-apply
  cancel-in-progress: false

jobs:
  complete-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: codex/mana-improvement-ux-p0-p1
      BASE_BRANCH: codex/complete-openryoko-to-mana-cloud-migration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mana-improvement-ux-p0-p1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Apply all pending patches in dependency order
        shell: bash
        run: |
          if [[ -f scripts/apply-mana-improvement-ux.mjs ]]; then node scripts/apply-mana-improvement-ux.mjs; fi
          if [[ -f scripts/harden-mana-improvement-ux.mjs ]]; then node scripts/harden-mana-improvement-ux.mjs; fi
          if [[ -f scripts/repair-mana-improvement-ux.mjs ]]; then node scripts/repair-mana-improvement-ux.mjs; fi
          node scripts/complete-mana-improvement-continuation.mjs

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit exact-head verified implementation
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- packages/cloud-runtime
          for temporary in \
            scripts/apply-mana-improvement-ux.mjs \
            scripts/harden-mana-improvement-ux.mjs \
            scripts/repair-mana-improvement-ux.mjs \
            scripts/complete-mana-improvement-continuation.mjs \
            .github/workflows/mana-improvement-ux-apply.yml \
            .github/workflows/mana-improvement-ux-pr.yml \
            .github/workflows/mana-improvement-ux-harden.yml \
            .github/workflows/mana-improvement-ux-repair.yml \
            .github/workflows/mana-improvement-continuation.yml; do
            if [[ -e "${temporary}" ]]; then git rm -- "${temporary}"; fi
          done

          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "feat(mana): resume improvement Stories from Slack"
            git push origin HEAD:${HEAD_BRANCH}
          fi

      - name: Ensure Draft PR and record exact-head verification
        shell: bash
        run: |
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${HEAD_BRANCH}" --base "${BASE_BRANCH}" --json number --jq '.[0].number // empty')"
          if [[ -z "${pr}" ]]; then
            gh pr create --repo "${GITHUB_REPOSITORY}" --draft --base "${BASE_BRANCH}" --head "${HEAD_BRANCH}" --title "feat(mana): 非エンジニア向け自己改善UXを追加" --body "#303をbaseに、改善依頼モーダル、実在thread root、構造化進捗・判断・Gate・成果カード、推奨判断とGateの同一Story再開、tenant authority境界を追加します。merge・deploy・secret変更は行いません。"
            pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${HEAD_BRANCH}" --base "${BASE_BRANCH}" --json number --jq '.[0].number // empty')"
          fi
          gh pr edit "${pr}" --repo "${GITHUB_REPOSITORY}" --add-label "" >/dev/null 2>&1 || true
          head_sha="$(git rev-parse HEAD)"
          gh pr comment "${pr}" --repo "${GITHUB_REPOSITORY}" --body-file - <<EOF
          ## P0/P1 exact-head verification

          - HEAD: \`${head_sha}\`
          - \`pnpm typecheck\`: PASS
          - \`pnpm test\`: PASS
          - \`pnpm build\`: PASS
          - \`git diff --check\`: PASS
          - guided request modal: verified
          - real Slack root ts propagation: verified
          - progress/result Block Kit: verified
          - recommended decision same-Story resume: verified
          - Gate same-Story continuation: verified
          - temporary patch/workflow files: removed
          - stacked base: \`${BASE_BRANCH}\` (#303)

          Merge and production deployment were not performed.
          EOF
