name: Deploy Mana Runtime to Lightsail

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Deployするmain上のcommit SHA（空欄なら現在のmain）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: openryoko-pilot-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare deployment target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      control_plane_sha: ${{ steps.control_plane.outputs.sha }}
      control_plane_digest: ${{ steps.control_plane.outputs.digest }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve and validate commit
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: scripts/deploy/resolve-deploy-ref "$REQUESTED_SHA"

      - name: Bind deploy control plane to workflow commit
        id: control_plane
        shell: bash
        run: |
          set -euo pipefail
          deploy_script_hash="$(sha256sum scripts/deploy/openryoko-pilot-deploy | cut -d' ' -f1)"
          command_script_hash="$(sha256sum scripts/deploy/openryoko-deploy-command | cut -d' ' -f1)"
          digest="$(printf '%s\n%s\n' "$deploy_script_hash" "$command_script_hash" | sha256sum | cut -d' ' -f1)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record approval target
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          CONTROL_PLANE_SHA: ${{ steps.control_plane.outputs.sha }}
          CONTROL_PLANE_DIGEST: ${{ steps.control_plane.outputs.digest }}
        shell: bash
        run: |
          {
            echo "### Deployment target awaiting production approval"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Control-plane commit: \`$CONTROL_PLANE_SHA\`"
            echo "- Control-plane digest: \`$CONTROL_PLANE_DIGEST\`"
            echo "- Approval boundary: the deploy job consumes these immutable job outputs"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy approved target
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: production
    steps:
      - name: Configure restricted SSH client
        env:
          DEPLOY_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.LIGHTSAIL_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy through forced command
        id: deploy
        env:
          DEPLOY_HOST: ${{ vars.LIGHTSAIL_DEPLOY_HOST }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          CONTROL_PLANE_DIGEST: ${{ needs.prepare.outputs.control_plane_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$CONTROL_PLANE_DIGEST"
          deploy_output="$RUNNER_TEMP/openryoko-deploy-output"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            openryoko-deploy@"$DEPLOY_HOST" \
            "deploy $TARGET_SHA $CONTROL_PLANE_DIGEST" | tee "$deploy_output"
          active_commit="$(sed -n 's/^openryoko deploy: active commit //p' "$deploy_output")"
          server_digest="$(sed -n 's/^openryoko deploy: control plane digest //p' "$deploy_output")"
          main_pid="$(sed -n 's/^openryoko deploy: main pid //p' "$deploy_output")"
          entrypoint="$(sed -n 's/^openryoko deploy: entrypoint //p' "$deploy_output")"
          test "$active_commit" = "$TARGET_SHA"
          test "$server_digest" = "$CONTROL_PLANE_DIGEST"
          [[ "$main_pid" =~ ^[1-9][0-9]*$ ]]
          test -n "$entrypoint"
          {
            printf 'main_pid=%s\n' "$main_pid"
            printf 'entrypoint=%s\n' "$entrypoint"
          } >> "$GITHUB_OUTPUT"

      - name: Record deployment summary
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          CONTROL_PLANE_DIGEST: ${{ needs.prepare.outputs.control_plane_digest }}
          CONTROL_PLANE_SHA: ${{ needs.prepare.outputs.control_plane_sha }}
          MAIN_PID: ${{ steps.deploy.outputs.main_pid }}
          ENTRYPOINT: ${{ steps.deploy.outputs.entrypoint }}
        shell: bash
        run: |
          {
            echo "### Mana Runtime deployment"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Control-plane commit: \`$CONTROL_PLANE_SHA\`"
            echo "- Control-plane digest: \`$CONTROL_PLANE_DIGEST\`"
            echo "- MainPID: \`$MAIN_PID\`"
            echo "- Entrypoint: \`$ENTRYPOINT\`"
            echo "- Environment: \`production\`"
            echo "- Result: server-side build, guarded restart, and systemd active check passed"
            echo "- Note: Slack/Web user outcome still requires the release verification in the Story"
          } >> "$GITHUB_STEP_SUMMARY"
