name: Deploy Mana Runtime to Lightsail

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Deployするmain上のcommit SHA（空欄なら現在のmain）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: openryoko-pilot-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy reviewed commit
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve and validate commit
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: scripts/deploy/resolve-deploy-ref "$REQUESTED_SHA"

      - name: Configure restricted SSH client
        env:
          DEPLOY_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.LIGHTSAIL_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy through forced command
        env:
          DEPLOY_HOST: ${{ vars.LIGHTSAIL_DEPLOY_HOST }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            openryoko-deploy@"$DEPLOY_HOST" \
            "deploy $TARGET_SHA"

      - name: Record deployment summary
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          {
            echo "### Mana Runtime deployment"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Environment: \`production\`"
            echo "- Result: server-side build, guarded restart, and systemd active check passed"
            echo "- Note: Slack/Web user outcome still requires the release verification in the Story"
          } >> "$GITHUB_STEP_SUMMARY"
