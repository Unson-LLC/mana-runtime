name: 失敗済み議事録を再実行

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 再実行する議事録run ID
        required: true
        type: string
      tenant_id:
        description: 対象tenant ID
        required: true
        type: string
      workspace_id:
        description: 対象Slack workspace ID
        required: true
        type: string
      reason:
        description: 再実行理由（監査用）
        required: true
        type: string

permissions:
  contents: read

jobs:
  retry:
    name: 保存済み権限を再照合して再投入
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://unson-business-mana-runtime.unson.workers.dev
    steps:
      - name: 入力形式を検証
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          TENANT_ID: ${{ inputs.tenant_id }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[A-Za-z0-9_-]{3,260}$ ]]
          [[ "$TENANT_ID" =~ ^[A-Za-z0-9_-]{3,128}$ ]]
          [[ "$WORKSPACE_ID" =~ ^[A-Z0-9]{3,32}$ ]]

      - name: 失敗済みrunを再投入
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          TENANT_ID: ${{ inputs.tenant_id }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          RETRY_REASON: ${{ inputs.reason }}
          SANDBOX_PROBE_TOKEN: ${{ secrets.SANDBOX_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SANDBOX_PROBE_TOKEN"
          action_ts="$(date +%s.%3N)"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          request_json() {
            local attempt status
            for attempt in $(seq 1 6); do
              status="$(curl -sS --connect-timeout 15 --max-time 30 \
                -o "$response_file" -w '%{http_code}' "$@")" || status="000"
              if [[ "$status" == "200" ]] && jq -e . "$response_file" >/dev/null 2>&1; then
                printf '%s' "$status"
                return 0
              fi
              echo "JSON API request failed (attempt=${attempt}, status=${status})" >&2
              sleep 2
            done
            return 1
          }
          status="$(request_json \
            -H "Authorization: Bearer $SANDBOX_PROBE_TOKEN" \
            --get \
            --data-urlencode "tenant_id=$TENANT_ID" \
            --data-urlencode "workspace_id=$WORKSPACE_ID" \
            "https://unson-business-mana-runtime.unson.workers.dev/admin/meeting-minutes/runs/${RUN_ID}/authorized-status")"
          jq -e --arg runId "$RUN_ID" --arg status "$status" \
            '$status == "200" and .runId == $runId' "$response_file" >/dev/null
          baseline_failed_at="$(jq -r '.diagnostics.failedAt // ""' "$response_file")"
          baseline_updated_at="$(jq -r '.updatedAt // ""' "$response_file")"
          baseline_source_projected_at="$(jq -r '.sourceStatus.projectedAt // ""' "$response_file")"
          status="$(request_json \
            -X POST \
            -H "Authorization: Bearer $SANDBOX_PROBE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn \
              --arg tenantId "$TENANT_ID" \
              --arg workspaceId "$WORKSPACE_ID" \
              --arg actionTs "$action_ts" \
              '{tenantId:$tenantId,workspaceId:$workspaceId,actionTs:$actionTs}')" \
            "https://unson-business-mana-runtime.unson.workers.dev/admin/meeting-minutes/runs/${RUN_ID}/authorized-retry")"
          jq -e --arg runId "$RUN_ID" --arg status "$status" \
            '$status == "200" and .runId == $runId and .enqueued == true' \
            "$response_file" >/dev/null
          for attempt in $(seq 1 90); do
            status="$(request_json \
              -H "Authorization: Bearer $SANDBOX_PROBE_TOKEN" \
              --get \
              --data-urlencode "tenant_id=$TENANT_ID" \
              --data-urlencode "workspace_id=$WORKSPACE_ID" \
              "https://unson-business-mana-runtime.unson.workers.dev/admin/meeting-minutes/runs/${RUN_ID}/authorized-status")"
            jq -e --arg runId "$RUN_ID" --arg status "$status" \
              '$status == "200" and .runId == $runId' "$response_file" >/dev/null
            run_status="$(jq -r '.status' "$response_file")"
            current_updated_at="$(jq -r '.updatedAt // ""' "$response_file")"
            if [[ "$run_status" == "completed" && -n "$current_updated_at" && "$current_updated_at" != "$baseline_updated_at" ]]; then
              if jq -e --arg baselineSourceProjectedAt "$baseline_source_projected_at" \
                '.checkpoint.hasGitHub == true and .checkpoint.hasSlackParent == true
                and .taskRegistration.pendingPresent == false and (.taskRegistration.failure == null)
                and .checkpoint.hasTaskCard == true
                and .sourceStatus.outcome == "completed"
                and (.sourceStatus.projectedAt // "") != ""
                and .sourceStatus.projectedAt != $baselineSourceProjectedAt
                and (.sourceStatus.projectionFailure == null)' "$response_file" >/dev/null; then
                break
              fi
              if jq -e '.taskRegistration.pendingPresent == true
                or ((.taskRegistration.failure.message // "") | endswith("_pending"))' \
                "$response_file" >/dev/null; then
                sleep 10
                continue
              fi
              echo "Fresh retry completed with an incomplete task integration" >&2
              jq '{runId,status,updatedAt,checkpoint,taskRegistration,sourceStatus,diagnostics}' "$response_file"
              exit 1
            fi
            if [[ "$run_status" == "failed" ]]; then
              current_failed_at="$(jq -r '.diagnostics.failedAt // ""' "$response_file")"
              if [[ -n "$current_failed_at" && "$current_failed_at" != "$baseline_failed_at" ]]; then
                jq . "$response_file"
                exit 1
              fi
            fi
            if [[ "$attempt" == "90" ]]; then
              jq . "$response_file"
              exit 1
            fi
            sleep 10
          done
          {
            echo "## 議事録run再投入"
            echo "- run ID: \`$RUN_ID\`"
            echo "- tenant ID: \`$TENANT_ID\`"
            echo "- workspace ID: \`$WORKSPACE_ID\`"
            echo "- 理由: $RETRY_REASON"
            echo "- 結果: GitHub保存、Slack投稿、タスク登録、タスクカード投稿まで完了"
          } >> "$GITHUB_STEP_SUMMARY"
