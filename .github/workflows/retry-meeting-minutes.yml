name: 失敗済み議事録のRunReceiptを再送

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 状態確認またはRunReceipt再送（Slack投稿等は再実行しない）
        required: true
        default: status
        type: choice
        options:
          - status
          - retry
      run_id:
        description: 再実行する議事録run ID
        required: true
        type: string
      tenant_id:
        description: 対象tenant ID
        required: true
        type: string
      workspace_id:
        description: 対象Slack workspace ID
        required: true
        type: string
      reason:
        description: 再実行理由（監査用）
        required: true
        type: string

concurrency:
  group: meeting-minutes-admin-${{ inputs.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retry:
    name: 保存済み権限を再照合してRunReceiptを再送
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://unson-business-mana-runtime.unson.workers.dev
    steps:
      - name: 入力形式を検証
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          TENANT_ID: ${{ inputs.tenant_id }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[A-Za-z0-9_-]{3,260}$ ]]
          [[ "$TENANT_ID" =~ ^[A-Za-z0-9_-]{3,128}$ ]]
          [[ "$WORKSPACE_ID" =~ ^[A-Z0-9]{3,32}$ ]]

      - name: 失敗済みrunのRunReceiptを再送
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          TENANT_ID: ${{ inputs.tenant_id }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          OPERATION: ${{ inputs.operation }}
          RETRY_REASON: ${{ inputs.reason }}
          SANDBOX_PROBE_TOKEN: ${{ secrets.SANDBOX_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SANDBOX_PROBE_TOKEN"
          action_ts="$(date +%s.%3N)"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          request_json() {
            local attempt status
            for attempt in $(seq 1 6); do
              status="$(curl -sS --connect-timeout 15 --max-time 30 \
                -o "$response_file" -w '%{http_code}' "$@")" || status="000"
              if [[ "$status" == "200" ]] && jq -e . "$response_file" >/dev/null 2>&1; then
                printf '%s' "$status"
                return 0
              fi
              echo "JSON API request failed (attempt=${attempt}, status=${status})" >&2
              sleep 2
            done
            return 1
          }
          print_safe_run_receipt_failure() {
            jq '
              def timestamp: if type == "string" and test("^[0-9TZ:.-]{20,30}$") then . else null end;
              def safe_identifier_or_null: if type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$") then . else null end;
              def safe_run_receipt_code: if type == "string" and test("^RUN_RECEIPT_[A-Z_]{3,96}$") then . else null end;
              {
                runId: (.runId | safe_identifier_or_null),
                status: (.status | if . == "completed" then . else null end),
                updatedAt: (.updatedAt | timestamp),
                outcomeCaseId: (.outcomeCaseId | safe_identifier_or_null),
                runReceipt: (if (.runReceipt | type) == "object" then {
                  caseId: (.runReceipt.caseId | safe_identifier_or_null),
                  receiptId: (.runReceipt.receiptId | safe_identifier_or_null),
                  status: (.runReceipt.status | if . == "pending" or . == "delivered" then . else null end),
                  failure: (if (.runReceipt.failure | type) == "object" then {
                    stage: (.runReceipt.failure.stage | if . == "run_receipt" then . else null end),
                    code: (.runReceipt.failure.code | safe_run_receipt_code),
                    retryable: (if (.runReceipt.failure.retryable | type) == "boolean" then .runReceipt.failure.retryable else null end),
                    failedAt: (.runReceipt.failure.failedAt | timestamp)
                  } else null end)
                } else null end)
              }' "$response_file"
          }
          status="$(request_json \
            -H "Authorization: Bearer $SANDBOX_PROBE_TOKEN" \
            --get \
            --data-urlencode "tenant_id=$TENANT_ID" \
            --data-urlencode "workspace_id=$WORKSPACE_ID" \
            "https://unson-business-mana-runtime.unson.workers.dev/admin/meeting-minutes/runs/${RUN_ID}/authorized-status")"
          jq -e --arg runId "$RUN_ID" --arg status "$status" \
            '$status == "200" and .runId == $runId' "$response_file" >/dev/null
          if [[ "$OPERATION" == "status" ]]; then
            jq '
              def number_or_null: if type == "number" then . else null end;
              def bool_or_null: if type == "boolean" then . else null end;
              def one_of($values): . as $value | if $values | index($value) then $value else null end;
              def timestamp: if type == "string" and test("^[0-9TZ:.-]{20,30}$") then . else null end;
              def action_timestamp: if type == "string" and test("^[0-9]{1,20}(\\.[0-9]{1,12})?$") then . else null end;
              def safe_identifier_or_null: if type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$") then . else null end;
              def safe_run_receipt_code: if type == "string" and test("^RUN_RECEIPT_[A-Z_]{3,96}$") then . else null end;
              {
                status: (.status | one_of(["awaiting_destination","routed","generated","github_saved","posting","completed","failed"])),
                updatedAt: (.updatedAt | timestamp),
                outcomeCaseId: (.outcomeCaseId | safe_identifier_or_null),
                processing: (if (.processing | type) == "object" then {
                  completedActionTs: (.processing.completedActionTs | action_timestamp),
                  completedAt: (.processing.completedAt | timestamp)
                } else null end),
                runReceipt: (
                  if (.runReceipt | type) == "object" then {
                    caseId: (.runReceipt.caseId | safe_identifier_or_null),
                    receiptId: (.runReceipt.receiptId | safe_identifier_or_null),
                    status: (.runReceipt.status | one_of(["pending","delivered"])),
                    deliveredAt: (.runReceipt.deliveredAt | timestamp),
                    failure: (if (.runReceipt.failure | type) == "object" then {
                      stage: (.runReceipt.failure.stage | one_of(["run_receipt"])),
                      code: (.runReceipt.failure.code | safe_run_receipt_code),
                      retryable: (.runReceipt.failure.retryable | bool_or_null),
                      failedAt: (.runReceipt.failure.failedAt | timestamp)
                    } else null end)
                  } else null end
                ),
                checkpoint: {
                  hasGitHub: (.checkpoint.hasGitHub | bool_or_null),
                  hasSlackParent: (.checkpoint.hasSlackParent | bool_or_null),
                  postedChunkCount: (.checkpoint.postedChunkCount | number_or_null),
                  hasTaskCard: (.checkpoint.hasTaskCard | bool_or_null)
                },
                taskRegistration: {
                  registeredCount: (.taskRegistration.registeredCount | number_or_null),
                  pendingPresent: (.taskRegistration.pendingPresent | bool_or_null),
                  hasFailure: (if .taskRegistration | type == "object" then .taskRegistration.failure != null else null end),
                  failure: (if .taskRegistration.failure | type == "object" then {
                    stage: (.stage | one_of(["task_registration","task_board","task_card"])),
                    failurePoint: (.failurePoint | one_of(["assignee_resolution","task_create","task_scope_update"])),
                    code: (if .code | type == "string" and test("^[A-Za-z][A-Za-z0-9_]{1,96}$") then . else null end),
                    status: (.status | number_or_null),
                    boundary: (if .boundary | type == "string" and test("^[A-Za-z][A-Za-z0-9_-]{0,119}$") then . else null end),
                    scopeReason: (if .scopeReason | type == "string" and test("^[A-Za-z][A-Za-z0-9_-]{0,119}$") then . else null end),
                    message: (if .message | type == "string" and test("^[A-Za-z][A-Za-z0-9_-]{1,128}$") then . else null end),
                    failedAt: (.failedAt | timestamp)
                  } else null end)
                },
                generation: {
                  startedAt: (.diagnostics.generation.startedAt | timestamp),
                  finishedAt: (.diagnostics.generation.finishedAt | timestamp),
                  elapsedMs: (.diagnostics.generation.elapsedMs | number_or_null),
                  timeoutMs: (.diagnostics.generation.timeoutMs | number_or_null),
                  exitCode: (.diagnostics.generation.exitCode | number_or_null),
                  outcome: (.diagnostics.generation.outcome | one_of(["success","timeout","nonzero_exit","transport_failure"])),
                  stderrCode: (.diagnostics.generation.stderrCode | one_of(["TIMEOUT","RATE_LIMITED","AUTHENTICATION_FAILED","HOOK_FAILED","CLI_ERROR","UNKNOWN"])),
                  stdoutBytes: (.diagnostics.generation.stdoutBytes | number_or_null),
                  streamEventCount: (.diagnostics.generation.streamEventCount | number_or_null),
                  progress: (.diagnostics.generation.progress | {
                    prompt_written: (.prompt_written | bool_or_null),
                    exec_started: (.exec_started | bool_or_null),
                    stdout_observed: (.stdout_observed | bool_or_null),
                    hook_observed: (.hook_observed | bool_or_null),
                    result_observed: (.result_observed | bool_or_null)
                  })
                }
              }' "$response_file"
            echo "状態確認のみ。RunReceipt再送・外部送信なし。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$OPERATION" == "retry" ]]
          if jq -e '.runReceipt.failure.stage == "run_receipt" and .runReceipt.failure.retryable == false' \
            "$response_file" >/dev/null; then
            echo "RunReceipt has a non-retryable contract failure; it was not resent" >&2
            print_safe_run_receipt_failure
            exit 1
          fi
          status="$(request_json \
            -X POST \
            -H "Authorization: Bearer $SANDBOX_PROBE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn \
              --arg tenantId "$TENANT_ID" \
              --arg workspaceId "$WORKSPACE_ID" \
              --arg actionTs "$action_ts" \
              '{tenantId:$tenantId,workspaceId:$workspaceId,actionTs:$actionTs}')" \
            "https://unson-business-mana-runtime.unson.workers.dev/admin/meeting-minutes/runs/${RUN_ID}/authorized-receipt-retry")"
          jq -e --arg runId "$RUN_ID" --arg status "$status" \
            '$status == "200" and .runId == $runId
              and .runReceipt.status == "delivered"
              and (.runReceipt.receiptId // "") != ""
              and (.runReceipt.deliveredAt // "") != ""' \
            "$response_file" >/dev/null
          status="$(request_json \
            -H "Authorization: Bearer $SANDBOX_PROBE_TOKEN" \
            --get \
            --data-urlencode "tenant_id=$TENANT_ID" \
            --data-urlencode "workspace_id=$WORKSPACE_ID" \
            "https://unson-business-mana-runtime.unson.workers.dev/admin/meeting-minutes/runs/${RUN_ID}/authorized-status")"
          jq -e --arg runId "$RUN_ID" --arg status "$status" \
            '$status == "200" and .runId == $runId
              and .runReceipt.status == "delivered"
              and (.runReceipt.receiptId // "") != ""
              and (.runReceipt.deliveredAt // "") != ""' "$response_file" >/dev/null
          {
            echo "## 議事録RunReceipt再送"
            echo "- run ID: \`$RUN_ID\`"
            echo "- tenant ID: \`$TENANT_ID\`"
            echo "- workspace ID: \`$WORKSPACE_ID\`"
            echo "- 理由: $RETRY_REASON"
            echo "- 結果: Brainbase RunReceiptの再送と読戻しを確認"
            echo "- 範囲外: Slack、GitHub、タスク登録、タスクカードは再実行しない"
          } >> "$GITHUB_STEP_SUMMARY"
