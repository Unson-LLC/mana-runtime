name: 失敗済み議事録を再実行

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 状態確認または再実行（再実行はSlack投稿等を伴う）
        required: true
        default: status
        type: choice
        options:
          - status
          - retry
      run_id:
        description: 再実行する議事録run ID
        required: true
        type: string
      tenant_id:
        description: 対象tenant ID
        required: true
        type: string
      workspace_id:
        description: 対象Slack workspace ID
        required: true
        type: string
      outcome_case_id:
        description: 紐付けるBrainbase OutcomeCase ID（任意）
        required: false
        type: string
      reason:
        description: 再実行理由（監査用）
        required: true
        type: string

concurrency:
  group: meeting-minutes-admin-${{ inputs.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retry:
    name: 保存済み権限を再照合して再投入
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://unson-business-mana-runtime.unson.workers.dev
    steps:
      - name: 入力形式を検証
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          TENANT_ID: ${{ inputs.tenant_id }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          OUTCOME_CASE_ID: ${{ inputs.outcome_case_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[A-Za-z0-9_-]{3,260}$ ]]
          [[ "$TENANT_ID" =~ ^[A-Za-z0-9_-]{3,128}$ ]]
          [[ "$WORKSPACE_ID" =~ ^[A-Z0-9]{3,32}$ ]]
          [[ -z "$OUTCOME_CASE_ID" || "$OUTCOME_CASE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$ ]]

      - name: 失敗済みrunを再投入
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          TENANT_ID: ${{ inputs.tenant_id }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          OUTCOME_CASE_ID: ${{ inputs.outcome_case_id }}
          OPERATION: ${{ inputs.operation }}
          RETRY_REASON: ${{ inputs.reason }}
          SANDBOX_PROBE_TOKEN: ${{ secrets.SANDBOX_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SANDBOX_PROBE_TOKEN"
          action_ts="$(date +%s.%3N)"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          request_json() {
            local attempt status
            for attempt in $(seq 1 6); do
              status="$(curl -sS --connect-timeout 15 --max-time 30 \
                -o "$response_file" -w '%{http_code}' "$@")" || status="000"
              if [[ "$status" == "200" ]] && jq -e . "$response_file" >/dev/null 2>&1; then
                printf '%s' "$status"
                return 0
              fi
              echo "JSON API request failed (attempt=${attempt}, status=${status})" >&2
              sleep 2
            done
            return 1
          }
          status="$(request_json \
            -H "Authorization: Bearer $SANDBOX_PROBE_TOKEN" \
            --get \
            --data-urlencode "tenant_id=$TENANT_ID" \
            --data-urlencode "workspace_id=$WORKSPACE_ID" \
            "https://unson-business-mana-runtime.unson.workers.dev/admin/meeting-minutes/runs/${RUN_ID}/authorized-status")"
          jq -e --arg runId "$RUN_ID" --arg status "$status" \
            '$status == "200" and .runId == $runId' "$response_file" >/dev/null
          if [[ "$OPERATION" == "status" ]]; then
            jq '
              def number_or_null: if type == "number" then . else null end;
              def bool_or_null: if type == "boolean" then . else null end;
              def one_of($values): . as $value | if $values | index($value) then $value else null end;
              def timestamp: if type == "string" and test("^[0-9TZ:.-]{20,30}$") then . else null end;
              def safe_identifier_or_null: if type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$") then . else null end;
              {
                status: (.status | one_of(["awaiting_destination","routed","generated","github_saved","posting","completed","failed"])),
                updatedAt: (.updatedAt | timestamp),
                outcomeCaseId: (.outcomeCaseId | safe_identifier_or_null),
                runReceipt: (
                  if (.runReceipt | type) == "object" then {
                    caseId: (.runReceipt.caseId | safe_identifier_or_null),
                    receiptId: (.runReceipt.receiptId | safe_identifier_or_null),
                    status: (.runReceipt.status | one_of(["pending","delivered"])),
                    deliveredAt: (.runReceipt.deliveredAt | timestamp)
                  } else null end
                ),
                checkpoint: {
                  hasGitHub: (.checkpoint.hasGitHub | bool_or_null),
                  hasSlackParent: (.checkpoint.hasSlackParent | bool_or_null),
                  postedChunkCount: (.checkpoint.postedChunkCount | number_or_null),
                  hasTaskCard: (.checkpoint.hasTaskCard | bool_or_null)
                },
                taskRegistration: {
                  registeredCount: (.taskRegistration.registeredCount | number_or_null),
                  pendingPresent: (.taskRegistration.pendingPresent | bool_or_null),
                  hasFailure: (if .taskRegistration | type == "object" then .taskRegistration.failure != null else null end)
                },
                generation: {
                  startedAt: (.diagnostics.generation.startedAt | timestamp),
                  finishedAt: (.diagnostics.generation.finishedAt | timestamp),
                  elapsedMs: (.diagnostics.generation.elapsedMs | number_or_null),
                  timeoutMs: (.diagnostics.generation.timeoutMs | number_or_null),
                  exitCode: (.diagnostics.generation.exitCode | number_or_null),
                  outcome: (.diagnostics.generation.outcome | one_of(["success","timeout","nonzero_exit","transport_failure"])),
                  stderrCode: (.diagnostics.generation.stderrCode | one_of(["TIMEOUT","RATE_LIMITED","AUTHENTICATION_FAILED","HOOK_FAILED","CLI_ERROR","UNKNOWN"])),
                  stdoutBytes: (.diagnostics.generation.stdoutBytes | number_or_null),
                  streamEventCount: (.diagnostics.generation.streamEventCount | number_or_null),
                  progress: (.diagnostics.generation.progress | {
                    prompt_written: (.prompt_written | bool_or_null),
                    exec_started: (.exec_started | bool_or_null),
                    stdout_observed: (.stdout_observed | bool_or_null),
                    hook_observed: (.hook_observed | bool_or_null),
                    result_observed: (.result_observed | bool_or_null)
                  })
                }
              }' "$response_file"
            echo "状態確認のみ。再投入・外部送信なし。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$OPERATION" == "retry" ]]
          baseline_failed_at="$(jq -r '.diagnostics.failedAt // ""' "$response_file")"
          baseline_updated_at="$(jq -r '.updatedAt // ""' "$response_file")"
          baseline_source_projected_at="$(jq -r '.sourceStatus.projectedAt // ""' "$response_file")"
          baseline_outcome_case_id="$(jq -r '.outcomeCaseId // ""' "$response_file")"
          expected_outcome_case_id="$OUTCOME_CASE_ID"
          if [[ -z "$expected_outcome_case_id" ]]; then
            expected_outcome_case_id="$baseline_outcome_case_id"
          fi
          test -n "$expected_outcome_case_id"
          status="$(request_json \
            -X POST \
            -H "Authorization: Bearer $SANDBOX_PROBE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn \
              --arg tenantId "$TENANT_ID" \
              --arg workspaceId "$WORKSPACE_ID" \
              --arg actionTs "$action_ts" \
              --arg outcomeCaseId "$expected_outcome_case_id" \
              '{tenantId:$tenantId,workspaceId:$workspaceId,actionTs:$actionTs,outcomeCaseId:$outcomeCaseId}')" \
            "https://unson-business-mana-runtime.unson.workers.dev/admin/meeting-minutes/runs/${RUN_ID}/authorized-retry")"
          jq -e --arg runId "$RUN_ID" --arg status "$status" \
            '$status == "200" and .runId == $runId and .enqueued == true' \
            "$response_file" >/dev/null
          for attempt in $(seq 1 90); do
            status="$(request_json \
              -H "Authorization: Bearer $SANDBOX_PROBE_TOKEN" \
              --get \
              --data-urlencode "tenant_id=$TENANT_ID" \
              --data-urlencode "workspace_id=$WORKSPACE_ID" \
              "https://unson-business-mana-runtime.unson.workers.dev/admin/meeting-minutes/runs/${RUN_ID}/authorized-status")"
            jq -e --arg runId "$RUN_ID" --arg status "$status" \
              '$status == "200" and .runId == $runId' "$response_file" >/dev/null
            run_status="$(jq -r '.status' "$response_file")"
            current_updated_at="$(jq -r '.updatedAt // ""' "$response_file")"
            if [[ "$run_status" == "completed" && -n "$current_updated_at" && "$current_updated_at" != "$baseline_updated_at" ]]; then
              if jq -e --arg baselineSourceProjectedAt "$baseline_source_projected_at" \
                --arg expectedOutcomeCaseId "$expected_outcome_case_id" \
                '.checkpoint.hasGitHub == true and .checkpoint.hasSlackParent == true
                and .taskRegistration.pendingPresent == false and (.taskRegistration.failure == null)
                and .checkpoint.hasTaskCard == true
                and .sourceStatus.outcome == "completed"
                and (.sourceStatus.projectedAt // "") != ""
                and .sourceStatus.projectedAt != $baselineSourceProjectedAt
                and (.sourceStatus.projectionFailure == null)
                and .outcomeCaseId == $expectedOutcomeCaseId
                and .runReceipt.status == "delivered"
                and .runReceipt.caseId == $expectedOutcomeCaseId
                and (.runReceipt.receiptId // "") != ""
                and (.runReceipt.deliveredAt // "") != ""' "$response_file" >/dev/null; then
                break
              fi
              if jq -e '(.sourceStatus.projectionFailure // null) != null' "$response_file" >/dev/null; then
                echo "Fresh retry source projection failed" >&2
                jq '{runId,status,updatedAt,outcomeCaseId,runReceipt,checkpoint,taskRegistration,sourceStatus,diagnostics}' "$response_file"
                exit 1
              fi
              if jq -e --arg baselineSourceProjectedAt "$baseline_source_projected_at" \
                '.sourceStatus.outcome != "completed"
                or (.sourceStatus.projectedAt // "") == ""
                or .sourceStatus.projectedAt == $baselineSourceProjectedAt' "$response_file" >/dev/null; then
                sleep 10
                continue
              fi
              if jq -e '.taskRegistration.pendingPresent == true
                or ((.taskRegistration.failure.message // "") | endswith("_pending"))' \
                "$response_file" >/dev/null; then
                sleep 10
                continue
              fi
              if ! jq -e '.checkpoint.hasGitHub == true and .checkpoint.hasSlackParent == true
                and .taskRegistration.pendingPresent == false and (.taskRegistration.failure == null)
                and .checkpoint.hasTaskCard == true' "$response_file" >/dev/null; then
                echo "Fresh retry completed with an incomplete task integration" >&2
                jq '{runId,status,updatedAt,outcomeCaseId,runReceipt,checkpoint,taskRegistration,sourceStatus,diagnostics}' "$response_file"
                exit 1
              fi
              if jq -e --arg expectedOutcomeCaseId "$expected_outcome_case_id" \
                '.outcomeCaseId != $expectedOutcomeCaseId
                or .runReceipt.status != "delivered"
                or .runReceipt.caseId != $expectedOutcomeCaseId
                or (.runReceipt.receiptId // "") == ""
                or (.runReceipt.deliveredAt // "") == ""' "$response_file" >/dev/null; then
                sleep 10
                continue
              fi
              echo "Fresh retry completed with an incomplete task integration" >&2
              jq '{runId,status,updatedAt,outcomeCaseId,runReceipt,checkpoint,taskRegistration,sourceStatus,diagnostics}' "$response_file"
              exit 1
            fi
            if [[ "$run_status" == "failed" ]]; then
              current_failed_at="$(jq -r '.diagnostics.failedAt // ""' "$response_file")"
              if [[ -n "$current_failed_at" && "$current_failed_at" != "$baseline_failed_at" ]]; then
                jq . "$response_file"
                exit 1
              fi
            fi
            if [[ "$attempt" == "90" ]]; then
              jq . "$response_file"
              exit 1
            fi
            sleep 10
          done
          {
            echo "## 議事録run再投入"
            echo "- run ID: \`$RUN_ID\`"
            echo "- tenant ID: \`$TENANT_ID\`"
            echo "- workspace ID: \`$WORKSPACE_ID\`"
            echo "- 理由: $RETRY_REASON"
            echo "- 結果: GitHub保存、Slack投稿、タスク登録、タスクカード投稿まで完了"
          } >> "$GITHUB_STEP_SUMMARY"
