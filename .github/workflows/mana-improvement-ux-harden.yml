name: Harden and verify Mana improvement UX

on:
  push:
    branches:
      - codex/mana-improvement-ux-p0-p1
    paths:
      - scripts/harden-mana-improvement-ux.mjs
      - .github/workflows/mana-improvement-ux-harden.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mana-improvement-ux-apply
  cancel-in-progress: false

jobs:
  harden-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: codex/mana-improvement-ux-p0-p1
      BASE_BRANCH: codex/complete-openryoko-to-mana-cloud-migration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mana-improvement-ux-p0-p1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Complete any pending composition-root patch
        shell: bash
        run: |
          if [[ -f scripts/apply-mana-improvement-ux.mjs ]]; then
            node scripts/apply-mana-improvement-ux.mjs
          fi
          node scripts/harden-mana-improvement-ux.mjs

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish verified implementation
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            packages/cloud-runtime/src/index.ts \
            packages/cloud-runtime/src/reply-pipeline.ts \
            packages/cloud-runtime/src/slack-interactions.ts \
            packages/cloud-runtime/src/development-callback.ts \
            packages/cloud-runtime/src/mana-improvement-slack.ts \
            packages/cloud-runtime/src/multitenancy/development-callback-proxy.ts \
            packages/cloud-runtime/src/__tests__/development-callback.test.ts \
            packages/cloud-runtime/src/__tests__/development-callback-ux.test.ts \
            packages/cloud-runtime/src/__tests__/mana-improvement-slack.test.ts

          for temporary in \
            scripts/apply-mana-improvement-ux.mjs \
            scripts/harden-mana-improvement-ux.mjs \
            .github/workflows/mana-improvement-ux-apply.yml \
            .github/workflows/mana-improvement-ux-pr.yml \
            .github/workflows/mana-improvement-ux-harden.yml; do
            if [[ -e "${temporary}" ]]; then git rm -- "${temporary}"; fi
          done

          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "fix(mana): harden guided improvement flow"
            git push origin HEAD:${HEAD_BRANCH}
          fi

      - name: Ensure stacked Draft PR exists
        shell: bash
        run: |
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${HEAD_BRANCH}" --base "${BASE_BRANCH}" --json url --jq '.[0].url // empty')"
          if [[ -z "${existing}" ]]; then
            cat > /tmp/pr-body.md <<'EOF'
          ## 目的

          `/vibepro`、Story、Gate、worktreeなどの開発用語を利用者へ要求せず、梅田さんを含む非エンジニアが「困っていること」と「どうなればよいか」からManaの改善を開始できるUXへ置き換えます。

          このPRは #303 をbaseとするstacked Draft PRです。旧Jimmyではなく、Cloudflare-native Mana runtimeだけを変更します。

          ## 実装

          - Slackの改善依頼モーダル
          - 実在する受付メッセージを正式なthread rootとして使用
          - `mana_improvement_request_v1`による型付き改善依頼
          - runner進捗の「整理中 / 変更中 / 確認中」表示
          - questions / gates / commits / Story / PRの構造化callback
          - completed / needs_decision / needs_input / failed / timed_outの利用者向けBlock Kit
          - canonical tenant authority、credential broker、idempotent Queue経路の維持

          ## 安全境界

          - merge、deploy、secret変更、本番データ変更は行わない
          - 未解決の業務判断は安全停止する
          - 旧Jimmy runtimeは変更しない

          ## Verification

          - `pnpm typecheck`
          - `pnpm test`
          - `pnpm build`
          - `git diff --check`
          EOF
            existing="$(gh pr create --repo "${GITHUB_REPOSITORY}" --draft --base "${BASE_BRANCH}" --head "${HEAD_BRANCH}" --title "feat(mana): 非エンジニア向け自己改善UXを追加" --body-file /tmp/pr-body.md)"
          fi
          echo "Draft PR: ${existing}"

      - name: Record exact-head verification on the PR
        shell: bash
        run: |
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${HEAD_BRANCH}" --base "${BASE_BRANCH}" --json number --jq '.[0].number // empty')"
          if [[ -n "${pr}" ]]; then
            head_sha="$(git rev-parse HEAD)"
            gh pr comment "${pr}" --repo "${GITHUB_REPOSITORY}" --body "## Exact-head verification\n\n- HEAD: \`${head_sha}\`\n- \`pnpm typecheck\`: PASS\n- \`pnpm test\`: PASS\n- \`pnpm build\`: PASS\n- \`git diff --check\`: PASS\n- temporary patch/workflow files: removed\n\nThis is a stacked Draft PR based on #303; merge and production deployment were not performed."
          fi
