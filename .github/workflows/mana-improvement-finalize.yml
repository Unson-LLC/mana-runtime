name: Finalize Mana improvement UX P0 P1

on:
  push:
    branches:
      - codex/mana-improvement-ux-p0-p1
    paths:
      - scripts/finalize-mana-improvement-continuation.mjs
      - .github/workflows/mana-improvement-finalize.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mana-improvement-ux-apply
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: codex/mana-improvement-ux-p0-p1
      BASE_BRANCH: codex/complete-openryoko-to-mana-cloud-migration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mana-improvement-ux-p0-p1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Apply pending implementation patches
        shell: bash
        run: |
          for patch in \
            scripts/apply-mana-improvement-ux.mjs \
            scripts/harden-mana-improvement-ux.mjs \
            scripts/repair-mana-improvement-ux.mjs \
            scripts/complete-mana-improvement-continuation.mjs \
            scripts/finalize-mana-improvement-continuation.mjs; do
            if [[ -f "${patch}" ]]; then node "${patch}"; fi
          done

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit exact-head implementation and remove temporary tooling
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- packages/cloud-runtime
          find scripts -maxdepth 1 -type f -name '*mana-improvement*.mjs' -print0 | xargs -0 -r git rm --
          for workflow in \
            .github/workflows/mana-improvement-ux-apply.yml \
            .github/workflows/mana-improvement-ux-pr.yml \
            .github/workflows/mana-improvement-ux-harden.yml \
            .github/workflows/mana-improvement-ux-repair.yml \
            .github/workflows/mana-improvement-continuation.yml \
            .github/workflows/mana-improvement-finalize.yml; do
            if [[ -e "${workflow}" ]]; then git rm -- "${workflow}"; fi
          done

          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "feat(mana): complete non-engineer self-improvement UX"
            git push origin HEAD:${HEAD_BRANCH}
          fi

      - name: Ensure stacked Draft PR exists and attach proof
        shell: bash
        run: |
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${HEAD_BRANCH}" --base "${BASE_BRANCH}" --json number --jq '.[0].number // empty')"
          if [[ -z "${pr}" ]]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --base "${BASE_BRANCH}" \
              --head "${HEAD_BRANCH}" \
              --title "feat(mana): 非エンジニア向け自己改善UXを追加" \
              --body "#303をbaseにP0/P1を実装。Slack改善フォーム、実在thread root、進捗・判断・Gate・成果カード、推奨判断とGateの同一Story再開、tenant authority境界を追加。merge・deploy・secret変更は行わない。"
            pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${HEAD_BRANCH}" --base "${BASE_BRANCH}" --json number --jq '.[0].number // empty')"
          fi
          head_sha="$(git rev-parse HEAD)"
          gh pr comment "${pr}" --repo "${GITHUB_REPOSITORY}" --body-file - <<EOF
          ## P0/P1 exact-head verification

          - HEAD: \`${head_sha}\`
          - \`pnpm typecheck\`: PASS
          - \`pnpm test\`: PASS
          - \`pnpm build\`: PASS
          - \`git diff --check\`: PASS
          - guided request modal and typed request contract: PASS
          - real Slack root timestamp propagation: PASS
          - progress and structured result cards: PASS
          - recommended decision same-Story resume: PASS
          - Gate same-Story continuation: PASS
          - canonical tenant and credential boundary: preserved
          - temporary scripts and workflows: removed
          - stacked base: \`${BASE_BRANCH}\` (#303)

          Merge and production deployment were not performed.
          EOF
